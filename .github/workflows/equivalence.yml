name: Equivalence Harness (SPEC-01 Phase 1b moat)

# Our correctness moat: on every push/PR, build the simulator image and prove it
# is EQUIVALENT to the shipped reference traces before any optimization is merged.
# A bit-exact failure here means a Tier-A break — which scores a unit zero — so
# this gate blocks the merge. See specs/README.md Guardrail #2 and SPEC-01 §6 Phase 1b.
#
# This is OUR gate, separate from the repo's own ci.yml. It needs Docker + LFS
# (real reference parquet, not pointer stubs) and the 3.13 scoring env.

on:
  push:
    branches: [main, "track3/**", "task/**"]
  pull_request:
    branches: [main]

env:
  QFBENCH2_COMMON_REF: v2.5.1

jobs:
  equivalence:
    name: Build image + prove equivalence to references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # reference *.parquet are LFS-tracked; the hash check needs real bytes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # MUST match the official grader (Guardrail #5)

      - name: Install scoring toolkit (3.13, anonymous public source)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.26" "pandas>=1.5" "scipy>=1.10" "pyarrow>=12"
          pip install "qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@${QFBENCH2_COMMON_REF}#subdirectory=common"

      - name: Build the simulator image (linux/amd64)
        run: docker build --platform=linux/amd64 -t track3-sim:ci baselines/

      - name: Build the reference cache from units/
        run: python regression_suite/build_reference_cache.py --copy

      - name: Prove equivalence (bit-exact; semantic fallback allowed for Tier-B/GPU)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python regression_suite/equivalence_harness.py \
            --candidate-image track3-sim:ci \
            --allow-semantic \
            --workers 2
