[package]
name = "track3_core"
version = "0.1.0"
edition = "2021"
description = "SPEC-01 Phase 2 — semantics-preserving compiled core (order book + event queue) for Track 3 ABIDES."

[lib]
name = "track3_core"
# cdylib for the Python extension module; rlib so Rust unit tests can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
# The core is latency-sensitive and runs inside the timed window — optimize hard.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
